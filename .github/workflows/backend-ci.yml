name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./Backend

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint with Clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test

  deploy:
    name: Deploy to Server
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: SSH Remote Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            set -e
            if [ -d "$HOME/Tracking_system" ]; then
              cd "$HOME/Tracking_system"
            elif [ -d "$HOME/tracking_system" ]; then
              cd "$HOME/tracking_system"
            elif [ -d "/var/www/Tracking_system" ]; then
              cd "/var/www/Tracking_system"
            elif [ -d "/var/www/tracking_system" ]; then
              cd "/var/www/tracking_system"
            else
              cd $(dirname $(find /root /var/www -name "docker-compose.yml" 2>/dev/null | head -n 1))
            fi
            echo "Deploying latest code in directory: $(pwd)"
            git fetch --all
            git reset --hard origin/main
            docker compose up -d --build || docker-compose up -d --build
            echo "Deployment successful!"

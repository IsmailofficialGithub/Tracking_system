# Docker Compose v2 file (version key removed)
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: tracking_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: 
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgres://postgres:postgrespassword@db:5432/tracking_db
      - JWT_SECRET=super-secret-jwt-token-with-at-least-32-bytes-long
    depends_on:
      - db
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped

    migrator:
      build:
        context: ./Backend
        dockerfile: Dockerfile
        target: builder
      command: ["cargo","sqlx","migrate","run"]
      environment:
        - DATABASE_URL=postgres://postgres:postgrespassword@db:5432/tracking_db
      depends_on:
        - db
      restart: "no"

volumes:
  postgres_data:

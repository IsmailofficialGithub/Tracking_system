[package]
name = "Backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
dashmap = "6.2.1"
dotenvy = "0.15.7"
futures-util = "0.3.34"
jsonwebtoken = "11.0.0"
reqwest = { version = "0.13.4", features = ["rustls", "stream", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }
tokio = { version = "1.53.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
uuid = { version = "1.26.0", features = ["serde", "v4"] }
